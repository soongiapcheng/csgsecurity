name: Daily Cyber Briefing

on:
  schedule:
    # Runs every day at 07:00 AM UTC (3:00 PM Singapore Time)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows you to trigger manually from GitHub's Actions tab

permissions:
  contents: write # Grants write permissions to commit generated HTML back to repo

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Remove legacy packages to avoid namespace conflicts with google-genai
          pip uninstall -y google-generativeai google-api-python-client || true
          pip install -r requirements.txt

      - name: Run Cyber Briefing Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_cyber_news.py

      - name: Commit and push generated HTML updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily cybersecurity report [skip ci]"
