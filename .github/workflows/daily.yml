name: Daily Cyber Briefing

on:
  schedule:
    # Runs at 07:00 AM UTC every day
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests feedparser google-generativeai
      - name: Execute script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_cyber_news.py
      
      - name: Deploy updated web page to GitHub Pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily cybersecurity page [skip ci]"
